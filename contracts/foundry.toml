[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../web/lib/chain" }]

[fuzz]
runs = 512

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
